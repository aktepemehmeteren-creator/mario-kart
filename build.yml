name: Build Mario Kart PSP

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    container: pspdev/pspdev:latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Build EBOOT.PBP
        shell: bash
        run: |
          set -euxo pipefail
          make clean || true
          make
          test -f EBOOT.PBP

      - name: Package EBOOT.PBP
        shell: bash
        run: |
          mkdir -p MarioKartPSP
          cp EBOOT.PBP MarioKartPSP/EBOOT.PBP

      - name: Upload EBOOT.PBP
        uses: actions/upload-artifact@v4
        with:
          name: MarioKartPSP-EBOOT-PBP
          path: MarioKartPSP/EBOOT.PBP
          if-no-files-found: error
